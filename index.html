<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NewsPop</title>
<style>
  :root {
    --bg: #111214;
    --panel: #1a1c1f;
    --border: #2a2d31;
    --text: #e8e8e8;
    --muted: #8a8d93;
    --left: #4a90d9;
    --center: #999999;
    --right: #d94a4a;
    --accent: #e8e8e8;
    --header-h: 61px;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 0;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  header .brand {
    display: flex;
    align-items: baseline;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    letter-spacing: -0.02em;
  }
  header .tagline {
    margin: 0 0 0 10px;
    font-size: 12px;
    color: var(--muted);
    font-weight: normal;
    white-space: nowrap;
  }
  #collapse-sidebar {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    width: 26px;
    height: 26px;
    border-radius: 6px;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
  }
  #collapse-sidebar:hover { color: var(--text); border-color: var(--text); }
  .side-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .side-title {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  nav { display: flex; gap: 4px; }
  nav button {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  nav button.active {
    color: var(--text);
    border-color: var(--text);
  }
  #layout {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    align-items: flex-start;
    padding: 16px;
    gap: 20px;
  }
  #layout.collapsed #sidebar { width: 34px; padding: 10px 6px; overflow: hidden; }
  #layout.collapsed .side-body,
  #layout.collapsed .side-title { display: none; }
  #layout.collapsed .side-top { justify-content: center; }
  #sidebar {
    width: 216px;
    scrollbar-gutter: stable;
    flex-shrink: 0;
    position: sticky;
    top: var(--header-h);
    height: calc(100vh - var(--header-h));
    overflow-y: auto;
    padding-right: 8px;
    box-sizing: border-box;
  }
  #sidebar section { margin-bottom: 20px; }
  #sidebar h3 {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 8px 0;
  }
  main {
    flex: 1;
    min-width: 0;
    max-width: 720px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: none;
    color: var(--muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .chip.on {
    color: #4caf50;
    border-color: #4caf50;
    background: rgba(76,175,80,0.12);
  }
  .chip.off {
    color: var(--muted);
    border-color: var(--border);
  }
  .chip-count { font-size: 10px; color: var(--muted); opacity: 0.7; }
  .chip-name { overflow-wrap: anywhere; }
  #outlet-chips { flex-direction: column; align-items: stretch; }
  #outlet-chips .chip {
    justify-content: flex-start;
    width: 100%;
    padding: 5px 10px;
  }
  .chip .outlet-logo {
    width: 16px;
    height: 16px;
    border-radius: 3px;
    flex-shrink: 0;
    background: var(--panel);
  }
  #outlet-chips .chip-count { margin-left: auto; }
  @media (min-width: 801px) {
    #geo-chips, #topic-chips { flex-direction: column; align-items: stretch; }
    #geo-chips .chip, #topic-chips .chip {
      justify-content: flex-start;
      width: 100%;
      padding: 5px 10px;
    }
    #geo-chips .chip-count, #topic-chips .chip-count { margin-left: auto; }
  }
  .sec-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sec-actions { display: flex; align-items: center; gap: 2px; }
  .reset-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    padding: 2px 4px;
    line-height: 1;
  }
  .reset-btn:hover { color: var(--text); }
  .reset-btn.hidden { display: none; }
  #search {
    width: 100%;
    box-sizing: border-box;
    padding: 6px 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    font-size: 13px;
  }
  .story {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .story h2 {
    font-size: 16px;
    font-weight: 500;
    margin: 0 0 10px 0;
    line-height: 1.4;
  }
  .bias-bar {
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
    display: flex;
    margin-bottom: 8px;
    background: var(--border);
  }
  .bias-bar div { height: 100%; }
  .bias-bar .l { background: var(--left); }
  .bias-bar .c { background: var(--center); }
  .bias-bar .r { background: var(--right); }
  .meta {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 10px;
  }
  .topic-tag {
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0 8px;
    font-size: 11px;
  }
  .sources {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .source-chip {
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
    text-decoration: none;
    color: var(--text);
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .source-chip .src-logo {
    width: 14px;
    height: 14px;
    border-radius: 2px;
    flex-shrink: 0;
    background: var(--panel);
  }
  .source-chip.bias-l { border-left: 3px solid var(--left); }
  .source-chip.bias-c { border-left: 3px solid var(--center); }
  .source-chip.bias-r { border-left: 3px solid var(--right); }
  .blindspot-tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .blindspot-tag.left { background: rgba(74,144,217,0.15); color: var(--left); }
  .blindspot-tag.right { background: rgba(217,74,74,0.15); color: var(--right); }
  .story-img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 6px;
    margin-bottom: 10px;
    background: var(--border);
  }
  .empty { color: var(--muted); text-align: center; padding: 40px 20px; }
  .my-bias-summary {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--muted);
  }
  .hist-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin: 20px 0 10px 0;
  }
  .hist-day {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    margin-bottom: 8px;
  }
  .hist-date { color: var(--muted); width: 80px; flex-shrink: 0; }
  .hist-bar {
    flex: 1;
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    display: flex;
    background: var(--border);
  }
  .hist-bar .l { background: var(--left); }
  .hist-bar .c { background: var(--center); }
  .hist-bar .r { background: var(--right); }
  .hist-pct { color: var(--muted); width: 150px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  #load-more {
    display: block;
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 12px;
  }
  #load-more:hover { border-color: var(--text); }
  #load-more.hidden { display: none; }
  @media (max-width: 800px) {
    #layout { flex-direction: column; padding: 8px; }
    #sidebar { width: 100%; position: static; top: auto; height: auto; overflow: visible; padding-right: 0; }
    main { max-width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>NewsPop</h1>
    <p class="tagline">Sorry to burst your bubble</p>
  </div>
  <nav id="tabs">
    <button data-tab="feed" class="active">Feed</button>
    <button data-tab="blindspots">Blindspot</button>
    <button data-tab="mybias">My Bias</button>
  </nav>
</header>

<div id="layout">
  <aside id="sidebar">
    <div class="side-top">
      <button id="collapse-sidebar" title="Hide filters" aria-label="Toggle filters">‹</button>
    </div>
    <div class="side-body">
    <section>
      <div class="sec-head"><h3>Search</h3><button class="reset-btn" id="reset-search" title="Clear search">↺</button></div>
      <input id="search" type="search" placeholder="Keyword..." autocomplete="off">
    </section>
    <section>
      <div class="sec-head"><h3>Bias</h3><button class="reset-btn" id="reset-bias" title="Clear bias filter">↺</button></div>
      <div class="chips" id="bias-chips">
        <button class="chip on" data-bias="left">Left</button>
        <button class="chip on" data-bias="center">Center</button>
        <button class="chip on" data-bias="right">Right</button>
      </div>
    </section>
    <section>
      <div class="sec-head"><h3>Time</h3><button class="reset-btn" id="reset-time" title="All time">↺</button></div>
      <div class="chips" id="time-chips">
        <button class="chip time" data-hours="24">24h</button>
        <button class="chip time" data-hours="48">48h</button>
        <button class="chip time" data-hours="168">Week</button>
        <button class="chip time on" data-hours="">All</button>
      </div>
    </section>
    <section>
      <div class="sec-head"><h3>Countries</h3><div class="sec-actions"><button class="reset-btn bulk-btn" data-bulk="geo" data-mode="on" title="Show all countries">All</button><button class="reset-btn bulk-btn" data-bulk="geo" data-mode="none" title="Hide all countries">None</button></div></div>
      <div class="chips" id="geo-chips"></div>
    </section>
    <section>
      <div class="sec-head"><h3>Topics</h3><div class="sec-actions"><button class="reset-btn bulk-btn" data-bulk="topic" data-mode="on" title="Show all topics">All</button><button class="reset-btn bulk-btn" data-bulk="topic" data-mode="none" title="Hide all topics">None</button></div></div>
      <div class="chips" id="topic-chips"></div>
    </section>
    <section>
      <div class="sec-head"><h3>Sources</h3><div class="sec-actions"><button class="reset-btn bulk-btn" data-bulk="outlet" data-mode="on" title="Show all sources">All</button><button class="reset-btn bulk-btn" data-bulk="outlet" data-mode="none" title="Hide all sources">None</button></div></div>
      <div class="chips" id="outlet-chips"></div>
    </section>
    </div>
  </aside>

  <main id="content">
    <div class="empty">Loading...</div>
  </main>
</div>

<script>
const content = document.getElementById("content");
const tabs = document.getElementById("tabs");
const sidebar = document.getElementById("sidebar");
const searchInput = document.getElementById("search");
const biasChips = document.getElementById("bias-chips");
const timeChips = document.getElementById("time-chips");
let currentTab = "feed";

const filters = { geos: new Set(), biases: new Set(["left", "center", "right"]), hours: null, q: "" };
const hiddenTopics = new Set(JSON.parse(localStorage.getItem("gz-hidden-topics") || "[]"));
const hiddenOutlets = new Set(JSON.parse(localStorage.getItem("gz-hidden-outlets") || "[]"));
const PAGE = 50;
let offset = 0;
let hasMore = true;

const GEO_FLAGS = { us: "🇺🇸", uk: "🇬🇧", ukraine: "🇺🇦", world: "🌐", canada: "🇨🇦", eu: "🇪🇺", africa: "🦁", australia: "🇦🇺", latam: "🦜", meast: "🕌" };
const GEO_LABELS = { us: "US", uk: "UK", ukraine: "Ukraine", world: "World", canada: "Canada", eu: "EU", africa: "Africa", australia: "Australia", latam: "LatAm", meast: "Middle East" };
const TOPIC_EMOJIS = { politics: "🏛️", war: "⚔️", economy: "💰", tech: "💻", health: "🏥", climate: "🌍", science: "🔬", crime: "🚨", general: "📰" };
function topicLabel(t) { return (TOPIC_EMOJIS[t] || "") + " " + t; }
function geoLabel(code) {
  return (GEO_FLAGS[code] || "📍") + " " + (GEO_LABELS[code] || code);
}

const collapseBtn = document.getElementById("collapse-sidebar");
let sidebarCollapsed = localStorage.getItem("gz-sidebar") === "1";
function applySidebar() {
  document.getElementById("layout").classList.toggle("collapsed", sidebarCollapsed);
  collapseBtn.textContent = sidebarCollapsed ? "›" : "‹";
  collapseBtn.title = sidebarCollapsed ? "Show filters" : "Hide filters";
}
collapseBtn.addEventListener("click", () => {
  sidebarCollapsed = !sidebarCollapsed;
  localStorage.setItem("gz-sidebar", sidebarCollapsed ? "1" : "0");
  applySidebar();
});
applySidebar();

const loadMoreBtn = document.createElement("button");
loadMoreBtn.id = "load-more";
loadMoreBtn.className = "hidden";
loadMoreBtn.textContent = "Load more";
loadMoreBtn.addEventListener("click", loadMore);

tabs.addEventListener("click", (e) => {
  if (e.target.tagName !== "BUTTON") return;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  currentTab = e.target.dataset.tab;
  load();
});

function biasClass(bias) {
  if (bias === null) return "c";
  if (bias <= -1) return "l";
  if (bias >= 1) return "r";
  return "c";
}

function renderStory(story, opts = {}) {
  const div = document.createElement("div");
  div.className = "story";

  let blindspotTag = "";
  if (opts.blindspot) {
    blindspotTag = `<div class="blindspot-tag ${story.blindspotSide}">Blindspot — ${story.note}</div>`;
  }

  const barWidth = story.ratedCount || 1;
  const bar = `
    <div class="bias-bar">
      <div class="l" style="width:${(story.left / barWidth) * 100}%"></div>
      <div class="c" style="width:${(story.center / barWidth) * 100}%"></div>
      <div class="r" style="width:${(story.right / barWidth) * 100}%"></div>
    </div>`;

  const chips = story.sources.map(s => `
    <a href="${s.link}" target="_blank" rel="noopener" class="source-chip bias-${biasClass(s.bias)}"
       onclick="trackClick(${s.id})"><img class="src-logo" src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(s.domain)}&sz=64" alt="" loading="lazy" onerror="this.style.display='none'">${s.name}</a>
  `).join("");

  const img = story.image
    ? `<img class="story-img" src="${escapeHtml(story.image)}" loading="lazy" onerror="this.style.display='none'" onload="if(this.naturalWidth<50||this.naturalHeight<50)this.style.display='none'" alt="">`
    : "";

  const topic = story.topic || (story.sources[0] && story.sources[0].topic);
  const topicTag = topic && topic !== "general" ? `<span class="topic-tag">${escapeHtml(topicLabel(topic))}</span>` : "";

  div.innerHTML = `
    ${blindspotTag}
    ${img}
    <h2>${escapeHtml(story.headline)}</h2>
    ${bar}
    <div class="meta">
      ${story.publishedAt ? `<span title="${new Date(story.publishedAt).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" })}">${timeAgo(story.publishedAt)}</span>` : ""}
      ${topicTag}
      ${story.ratedCount ? `<span>${story.leftPct}% left · ${story.centerPct}% center · ${story.rightPct}% right</span>` : ""}
    </div>
    <div class="sources">${chips}</div>
  `;
  return div;
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function timeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const min = Math.floor(diff / 60000);
  if (min < 1) return "just now";
  if (min < 60) return min === 1 ? "1 minute ago" : `${min} minutes ago`;
  const hrs = Math.floor(min / 60);
  if (hrs < 24) return hrs === 1 ? "1 hour ago" : `${hrs} hours ago`;
  const days = Math.floor(hrs / 24);
  if (days < 7) return days === 1 ? "1 day ago" : `${days} days ago`;
  return new Date(iso).toLocaleDateString(undefined, { dateStyle: "medium" });
}

function trackClick(articleId) {
  fetch("/api/click", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ articleId })
  });
}
window.trackClick = trackClick;

// ---------- feed fetching + filters ----------
function feedParams(off) {
  const p = new URLSearchParams();
  if (filters.geos.size) p.set("geo", [...filters.geos].join(","));
  if (hiddenTopics.size) p.set("notopic", [...hiddenTopics].join(","));
  if (hiddenOutlets.size) p.set("nooutlet", [...hiddenOutlets].join(","));
  if (filters.hours) p.set("hours", filters.hours);
  if (filters.q) p.set("q", filters.q);
  p.set("limit", PAGE);
  p.set("offset", off);
  return p.toString();
}

function dominantBias(s) {
  if (!s.ratedCount) return null;
  if (s.left >= s.center && s.left >= s.right) return "left";
  if (s.right >= s.center && s.right >= s.left) return "right";
  return "center";
}

function passesBias(s) {
  const d = dominantBias(s);
  if (d === null) return true;
  return filters.biases.has(d);
}

async function fetchFeedPage(off) {
  const res = await fetch("/api/feed?" + feedParams(off));
  return res.json();
}

function appendLoadMore() {
  loadMoreBtn.classList.remove("hidden");
  content.appendChild(loadMoreBtn);
}

async function load() {
  if (currentTab === "feed") return loadFeed();
  if (currentTab === "blindspots") return loadBlindspots();
  if (currentTab === "mybias") return loadMyBias();
}

async function loadFeed() {
  content.innerHTML = `<div class="empty">Loading...</div>`;
  offset = 0;
  const raw = await fetchFeedPage(0);
  const stories = raw.filter(passesBias);
  hasMore = raw.length === PAGE;
  content.innerHTML = "";
  if (stories.length === 0) {
    content.innerHTML = `<div class="empty">No stories match your filters. Ingestion may still be running — check back in a minute.</div>`;
    return;
  }
  stories.forEach(s => content.appendChild(renderStory(s)));
  appendLoadMore();
}

async function loadMore() {
  offset += PAGE;
  loadMoreBtn.disabled = true;
  const raw = await fetchFeedPage(offset);
  const stories = raw.filter(passesBias);
  hasMore = raw.length === PAGE;
  loadMoreBtn.remove();
  loadMoreBtn.disabled = false;
  stories.forEach(s => content.appendChild(renderStory(s)));
  if (hasMore) appendLoadMore();
}

async function loadBlindspots() {
  const res = await fetch("/api/blindspots");
  const stories = await res.json();
  content.innerHTML = "";
  if (stories.length === 0) {
    content.innerHTML = `<div class="empty">No blindspots detected right now.</div>`;
    return;
  }
  stories.forEach(s => content.appendChild(renderStory(s, { blindspot: true })));
}

async function loadMyBias() {
  const res = await fetch("/api/my-bias");
  const b = await res.json();
  let hist = "";
  if (b.history && b.history.some(d => d.total > 0)) {
    hist = `<div class="hist-title">Last 7 days</div>` + b.history.map(d => `
      <div class="hist-day">
        <span class="hist-date">${d.date}</span>
        <div class="hist-bar">
          <div class="l" style="width:${d.leftPct}%"></div>
          <div class="c" style="width:${d.centerPct}%"></div>
          <div class="r" style="width:${d.rightPct}%"></div>
        </div>
        <span class="hist-pct">${d.left}L · ${d.center}C · ${d.right}R</span>
      </div>`).join("");
  }
  content.innerHTML = `
    <div class="my-bias-summary">
      <strong style="color:var(--text)">Your reading, ${b.totalClicks} click${b.totalClicks === 1 ? "" : "s"} tracked</strong><br><br>
      Left: ${b.leftPct}% (${b.left}) &nbsp; Center: ${b.centerPct}% (${b.center}) &nbsp; Right: ${b.rightPct}% (${b.right})
      ${b.unrated ? `<br>Unrated outlet clicks: ${b.unrated}` : ""}
    </div>
    ${hist || `<div class="empty">No tracked clicks in the last 7 days.</div>`}
  `;
}

// ---------- sidebar: filter chips ----------
async function loadFilters() {
  const res = await fetch("/api/filters");
  const data = await res.json();
  buildChips("geo", data.geos || []);
  buildChips("topic", data.topics || []);
  buildChips("outlet", data.outlets || []);
}

function buildChips(kind, items) {
  const el = document.getElementById(kind + "-chips");
  el.innerHTML = "";
  if (kind === "geo") items = [...items].sort((a, b) => geoLabel(a.name).localeCompare(geoLabel(b.name)));
  for (const item of items) {
    const b = document.createElement("button");
    b.className = "chip";
    b.dataset.kind = kind;
    b.dataset.value = item.name;
    let icon = "";
    if (kind === "geo") icon = geoLabel(item.name);
    else if (kind === "topic") icon = topicLabel(item.name);
    else if (kind === "outlet") {
      icon = `<img class="outlet-logo" src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(item.name)}&sz=64" alt="" loading="lazy" onerror="this.style.display='none'">`;
    }
    const label = kind === "outlet" ? (item.label || item.name) : icon;
    b.innerHTML = `<span class="chip-name">${escapeHtml(label)}</span><span class="chip-count">${item.count}</span>`;
    if (kind === "topic") b.classList.toggle("on", !hiddenTopics.has(item.name));
    if (kind === "outlet") b.classList.toggle("on", !hiddenOutlets.has(item.name));
    el.appendChild(b);
  }
}

function toggleFilter(kind, value) {
  const set = kind === "geo" ? filters.geos : null;
  if (!set) return;
  const active = !set.has(value);
  if (active) set.add(value); else set.delete(value);
  syncChips();
  load();
}

function toggleHidden(kind, value) {
  const hidden = kind === "topic" ? hiddenTopics : hiddenOutlets;
  if (hidden.has(value)) hidden.delete(value); else hidden.add(value);
  localStorage.setItem("gz-hidden-" + (kind === "topic" ? "topics" : "outlets"), JSON.stringify([...hidden]));
  syncChips();
  load();
}

sidebar.addEventListener("click", (e) => {
  const chip = e.target.closest(".chip[data-kind]");
  if (!chip) return;
  if (chip.dataset.kind === "topic" || chip.dataset.kind === "outlet") toggleHidden(chip.dataset.kind, chip.dataset.value);
  else toggleFilter(chip.dataset.kind, chip.dataset.value);
});

biasChips.addEventListener("click", (e) => {
  const c = e.target.closest(".chip");
  if (!c) return;
  const v = c.dataset.bias;
  if (filters.biases.has(v)) filters.biases.delete(v); else filters.biases.add(v);
  c.classList.toggle("on", filters.biases.has(v));
  syncResetButtons();
  load();
});

timeChips.addEventListener("click", (e) => {
  const c = e.target.closest(".chip");
  if (!c) return;
  document.querySelectorAll("#time-chips .chip").forEach(x => x.classList.remove("on"));
  c.classList.add("on");
  filters.hours = c.dataset.hours ? Number(c.dataset.hours) : null;
  syncResetButtons();
  load();
});

let searchTimer;
searchInput.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    filters.q = searchInput.value.trim().toLowerCase();
    syncResetButtons();
    load();
  }, 400);
});

function resetFilters(kind) {
  if (kind === "search") { filters.q = ""; searchInput.value = ""; }
  else if (kind === "geo") filters.geos.clear();
  else if (kind === "topics") { hiddenTopics.clear(); localStorage.removeItem("gz-hidden-topics"); }
  else if (kind === "outlets") { hiddenOutlets.clear(); localStorage.removeItem("gz-hidden-outlets"); }
  else if (kind === "bias") filters.biases = new Set(["left", "center", "right"]);
  else if (kind === "time") filters.hours = null;
  if (kind === "time") {
    document.querySelectorAll("#time-chips .chip").forEach(x => x.classList.toggle("on", x.dataset.hours === ""));
  } else {
    syncChips();
  }
  syncResetButtons();
  load();
}
const resetMap = {
  "reset-search": "search",
  "reset-topics": "topics",
  "reset-outlets": "outlets",
  "reset-bias": "bias",
  "reset-time": "time"
};
for (const [id, kind] of Object.entries(resetMap)) {
  const btn = document.getElementById(id);
  if (btn) btn.addEventListener("click", () => resetFilters(kind));
}

function syncChips() {
  document.querySelectorAll("#sidebar .chip[data-kind]").forEach(c => {
    if (c.dataset.kind === "topic" || c.dataset.kind === "outlet") {
      const hidden = c.dataset.kind === "topic" ? hiddenTopics : hiddenOutlets;
      c.classList.toggle("on", !hidden.has(c.dataset.value));
      c.classList.toggle("off", hidden.has(c.dataset.value));
      return;
    }
    const set = c.dataset.kind === "geo" ? filters.geos : null;
    c.classList.toggle("on", set ? set.has(c.dataset.value) : false);
  });
  document.querySelectorAll("#bias-chips .chip").forEach(c => {
    c.classList.toggle("on", filters.biases.has(c.dataset.bias));
  });
  document.querySelectorAll("#time-chips .chip").forEach(c => {
    const v = c.dataset.hours;
    c.classList.toggle("on", v === "" ? filters.hours === null : filters.hours === Number(v));
  });
  syncResetButtons();
}

function syncResetButtons() {
  const dirty = {
    "reset-search": filters.q !== "",
    "reset-bias": filters.biases.size !== 3,
    "reset-time": filters.hours !== null,
    "reset-topics": hiddenTopics.size > 0,
    "reset-outlets": hiddenOutlets.size > 0,
  };
  document.querySelectorAll('#sidebar .reset-btn[id^="reset-"]').forEach(btn => {
    btn.classList.toggle("hidden", !dirty[btn.id]);
  });
}

document.querySelectorAll(".bulk-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const kind = btn.dataset.bulk;
    const chips = document.querySelectorAll(`#${kind}-chips .chip`);
    if (kind === "geo") {
      if (btn.dataset.mode === "on") filters.geos = new Set([...chips].map(c => c.dataset.value));
      else filters.geos = new Set(["__none__"]);
      syncChips();
      load();
      return;
    }
    const hidden = kind === "topic" ? hiddenTopics : hiddenOutlets;
    if (btn.dataset.mode === "on") hidden.clear();
    else chips.forEach(c => hidden.add(c.dataset.value));
    localStorage.setItem("gz-hidden-" + (kind === "topic" ? "topics" : "outlets"), JSON.stringify([...hidden]));
    syncChips();
    load();
  });
});

loadFilters();
syncChips();
load();
</script>

</body>
</html>
